server.port=${NODE_PORT:8080}

# Node identity
node.id=${NODE_ID:node-1}
node.port=${NODE_PORT:8080}

# Comma-separated list of ALL peer nodes (including self) e.g. node-1:8080,node-2:8081,node-3:8082
node.peers=${NODE_PEERS:node-1:8080,node-2:8081,node-3:8082}

# Replication factor — how many nodes store each key
replication.factor=${REPLICATION_FACTOR:2}

# WAL file path (mapped to a Docker volume in production)
wal.file.path=${WAL_PATH:/tmp/wal.log}

# Health-check interval (ms) for leader failover detection
health.check.interval.ms=3000
