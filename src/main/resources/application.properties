server.port=${NODE_PORT:8080}

# Node identity
node.id=${NODE_ID:node-1}
node.port=${NODE_PORT:8080}

# Comma-separated list of ALL peer nodes
node.peers=${NODE_PEERS:node-1:8080,node-2:8080,node-3:8080}

# Replication factor
replication.factor=${REPLICATION_FACTOR:2}

# WAL file path
wal.file.path=${WAL_PATH:/tmp/wal.log}

# Raft election timeout range (ms)
# Randomised per node to prevent split votes
raft.election.timeout.min=${RAFT_ELECTION_TIMEOUT_MIN:150}
raft.election.timeout.max=${RAFT_ELECTION_TIMEOUT_MAX:300}