version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# 3-node Distributed KV Store Cluster
#
# All nodes share the same Docker image but get different environment variables.
# They communicate via Docker's internal DNS (service name = hostname).
#
# NODE_PEERS tells each node about every other node in the cluster so the
# consistent hash ring is initialised identically on all three.
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  NODE_PEERS: "node-1:8080,node-2:8080,node-3:8080"
  REPLICATION_FACTOR: "2"

services:

  node-1:
    build: .
    container_name: kv-node-1
    environment:
      <<: *common-env
      NODE_ID: "node-1"
      NODE_PORT: "8080"
      WAL_PATH: "/data/wal.log"
    ports:
      - "8081:8080"   # host:container — access node-1 at localhost:8081
    volumes:
      - node1-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node-2:
    build: .
    container_name: kv-node-2
    environment:
      <<: *common-env
      NODE_ID: "node-2"
      NODE_PORT: "8080"
      WAL_PATH: "/data/wal.log"
    ports:
      - "8082:8080"   # access node-2 at localhost:8082
    volumes:
      - node2-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node-3:
    build: .
    container_name: kv-node-3
    environment:
      <<: *common-env
      NODE_ID: "node-3"
      NODE_PORT: "8080"
      WAL_PATH: "/data/wal.log"
    ports:
      - "8083:8080"   # access node-3 at localhost:8083
    volumes:
      - node3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  node1-data:
  node2-data:
  node3-data:
